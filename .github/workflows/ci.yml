# PHP 8.6 is not released yet: the tests run on its pre-release build as well and may fail there without
# failing the run (continue-on-error). The Composer files, static analysis and code style are checked on 8.5.
# Actions are pinned to the commit of a release; the comment names the release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: shivammathur/node:24.04
    # A run takes a few minutes; a test that hangs (a FIFO opened blocking, say) must not hold the runner
    timeout-minutes: 10
    continue-on-error: ${{ matrix.php == '8.6' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.6']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          # posix lets the test for an unreadable file drop root privileges
          extensions: posix
          coverage: none

      - name: Check the PHP version
        run: |
          php -r 'echo PHP_VERSION, PHP_EOL; exit(str_starts_with(PHP_VERSION, getenv("WANTED") . ".") ? 0 : 1);'
        env:
          WANTED: ${{ matrix.php }}

      # The FastCGI and CGI tests need php-cgi next to the PHP binary, found the way the tests look for it.
      # Without it they are skipped, and the tests run with --fail-on-skipped
      - name: Install php-cgi
        shell: bash
        run: |
          cgi() { php -r 'require "tests/Unit/PhpCgi.php"; echo Sodaho\EnvLoader\Tests\Unit\PhpCgi::binary();'; }
          echo "PHP_BINARY: $(php -r 'echo PHP_BINARY;')"
          if [ -z "$(cgi)" ]; then
            sudo=$([ "$(id -u)" -eq 0 ] || echo sudo)
            $sudo apt-get update -q
            $sudo apt-get install -y -q "php${{ matrix.php }}-cgi"
          fi
          found="$(cgi)"
          echo "php-cgi: ${found:-not found}"
          [ -n "$found" ]

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # A skipped test fails the run here: locally a test may be skipped where its platform is missing
      - name: Run tests
        run: composer test -- --fail-on-skipped

  checks:
    runs-on: ubuntu-latest
    container: shivammathur/node:24.04
    timeout-minutes: 10
    name: Composer files, static analysis and code style

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check code style
        run: composer cs

      - name: Run PHPStan
        run: composer analyse

      # Known security advisories for the locked development tools (the package itself has no dependencies).
      # Packagist answers this; if it cannot be reached the step only warns, so an outage does not fail the run.
      # Abandoned packages are reported, not failed: that is no vulnerability
      - name: Check for security advisories
        run: composer audit --locked --abandoned=report --ignore-unreachable
